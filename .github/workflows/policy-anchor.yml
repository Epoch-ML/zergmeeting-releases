# Bootstrap note: this workflow becomes authoritative only after an independently
# reviewed owner action installs it on protected main (or as an organization
# required workflow). Pull request heads are data and are never checked out.
name: Protected-base release policy

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled

permissions:
  contents: read

concurrency:
  group: protected-base-release-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  anchored-policy:
    name: Protected-base release policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: trusted-policy
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"

      - name: Install only protected-base policy dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix trusted-policy

      - id: protected-input-review
        name: Resolve head-bound independent review
        env:
          APPROVAL_LABEL: zergmeeting-release-policy-reviewed
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name || '' }}
          EVENT_SENDER: ${{ github.event.sender.login }}
          EVENT_SENDER_TYPE: ${{ github.event.sender.type }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPOSITORY_READ_TOKEN: ${{ github.token }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        shell: bash
        run: |
          set -euo pipefail
          approved=false
          if [[ "$EVENT_ACTION" == "labeled" && "$EVENT_LABEL" == "$APPROVAL_LABEL" && \
            "$RUN_ATTEMPT" == "1" && "$TRIGGERING_ACTOR" == "$EVENT_SENDER" && \
            "$EVENT_SENDER_TYPE" == "User" && "$EVENT_SENDER" != "$PR_AUTHOR" ]]; then
            [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
            [[ "$EVENT_SENDER" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]]
            [[ "$REPOSITORY_READ_TOKEN" =~ ^[A-Za-z0-9_]+$ ]]
            [[ "${#REPOSITORY_READ_TOKEN}" -le 512 ]]
            umask 077
            curl_config="$(mktemp "$RUNNER_TEMP/zergmeeting-policy-review-curl.XXXXXX")"
            trap 'rm -f -- "$curl_config"' EXIT
            chmod 600 "$curl_config"
            {
              printf '%s\n' 'header = "Accept: application/vnd.github+json"'
              printf 'header = "Authorization: Bearer %s"\n' "$REPOSITORY_READ_TOKEN"
              printf '%s\n' 'header = "X-GitHub-Api-Version: 2022-11-28"'
            } >"$curl_config"
            unset REPOSITORY_READ_TOKEN
            permission_payload="$(curl --config "$curl_config" \
              --fail-with-body --silent --show-error \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/collaborators/$EVENT_SENDER/permission")"
            rm -f -- "$curl_config"
            trap - EXIT
            repository_role="$(jq -er '.role_name | strings' <<<"$permission_payload")"
            unset permission_payload
            if [[ "$repository_role" == "admin" || \
              "$repository_role" == "maintain" || "$repository_role" == "write" ]]; then
              approved=true
            else
              echo "::notice::$EVENT_SENDER does not independently authorize protected inputs"
            fi
          fi
          unset REPOSITORY_READ_TOKEN
          echo "approved=$approved" >>"$GITHUB_OUTPUT"

      - name: Fetch the immutable pull request objects without checkout
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: refs/pull/${{ github.event.pull_request.number }}/head
          REPOSITORY_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_REF" =~ ^refs/pull/[1-9][0-9]*/head$ ]]
          repository="$RUNNER_TEMP/immutable-pr.git"
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_NOSYSTEM=1
          git -c init.defaultBranch=policy init --bare --quiet "$repository"
          git -C "$repository" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          authorization="$(printf 'x-access-token:%s' "$REPOSITORY_READ_TOKEN" | base64 -w 0)"
          header_key="http.https://github.com/.extraheader"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="$header_key"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization"
          unset REPOSITORY_READ_TOKEN authorization header_key
          git -C "$repository" -c protocol.version=2 \
            -c core.hooksPath=/dev/null \
            fetch --filter=blob:none --no-tags origin "$HEAD_REF"
          [[ "$(git -C "$repository" rev-parse FETCH_HEAD)" == "$EXPECTED_HEAD_SHA" ]]
          git -C "$repository" update-ref refs/policy/head "$EXPECTED_HEAD_SHA"
          git -C "$repository" -c protocol.version=2 \
            -c core.hooksPath=/dev/null \
            fetch --filter=blob:none --no-tags origin "$BASE_SHA"
          [[ "$(git -C "$repository" rev-parse FETCH_HEAD)" == "$BASE_SHA" ]]
          git -C "$repository" update-ref refs/policy/base "$BASE_SHA"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0

      - name: Materialize only bounded candidate data
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ROUTINE_PROTECTED_CHANGE_APPROVED: ${{ steps.protected-input-review.outputs.approved }}
        shell: bash
        run: |
          set -euo pipefail
          repository="$RUNNER_TEMP/immutable-pr.git"
          diff_path="$RUNNER_TEMP/candidate-paths.z"
          candidate_path="$RUNNER_TEMP/candidate-release.yml"
          set +o pipefail
          git -C "$repository" -c core.hooksPath=/dev/null \
            diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" \
            | head -c 262145 >"$diff_path"
          pipeline_status=("${PIPESTATUS[@]}")
          set -o pipefail
          [[ "${pipeline_status[1]}" -eq 0 ]]
          [[ "${pipeline_status[0]}" -eq 0 || "${pipeline_status[0]}" -eq 141 ]]
          [[ "$(wc -c <"$diff_path" | tr -d ' ')" -le 262144 ]]
          record="$(git -C "$repository" -c core.hooksPath=/dev/null \
            ls-tree "$HEAD_SHA" -- .github/workflows/release.yml)"
          read -r candidate_mode candidate_type candidate_object candidate_name <<<"$record"
          [[ "$candidate_type" == "blob" ]]
          [[ "$candidate_name" == $'.github/workflows/release.yml' ]]
          candidate_size="$(git -C "$repository" cat-file -s "$candidate_object")"
          [[ "$candidate_size" =~ ^[0-9]+$ && "$candidate_size" -le 262144 ]]
          git -C "$repository" cat-file blob "$candidate_object" >"$candidate_path"
          node trusted-policy/scripts/anchored-policy.mjs \
            "$BASE_SHA" "$HEAD_SHA" "$diff_path" "$candidate_mode" \
            "$candidate_size" "$candidate_path" \
            "$ROUTINE_PROTECTED_CHANGE_APPROVED"
